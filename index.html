<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akshat Style Deep Link Generator</title>
    <style>
        :root {
            --primary: #ff2a2a;
            --primary-hover: #d61b1b;
            --bg: #0d0f12;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #f0f6fc;
            --subtext: #8b949e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 32px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 24px; color: var(--text); margin-bottom: 8px; }
        .header h1 span { color: var(--primary); }
        .header p { color: var(--subtext); font-size: 14px; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; color: var(--subtext); margin-bottom: 8px; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 14px; background: #0d1117; border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 15px; outline: none; transition: 0.2s; }
        .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(255,42,42,0.3); }

        .btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: var(--primary-hover); }

        .result-box { margin-top: 24px; background: #0d1117; border: 1px dashed var(--primary); border-radius: 10px; padding: 16px; display: none; }
        .result-title { font-size: 12px; color: var(--primary); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
        .result-url { font-family: monospace; font-size: 13px; color: #58a6ff; word-break: break-all; margin-bottom: 12px; background: #161b22; padding: 10px; border-radius: 6px; }
        .action-btns { display: flex; gap: 10px; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; cursor: pointer; flex: 1; font-weight: 600; transition: 0.2s; }
        .btn-outline:hover { background: var(--border); }
        .btn-open { background: #238636; border: none; color: white; padding: 10px; border-radius: 6px; cursor: pointer; flex: 1; font-weight: 600; text-decoration: none; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><span>Smart</span> Deeplink Generator</h1>
        <p>Open Social Media Links Directly Inside Native Apps</p>
    </div>

    <div class="input-group">
        <label>Enter Original URL</label>
        <input type="url" id="targetUrl" placeholder="Paste YouTube, Instagram, or Telegram URL..." required>
    </div>

    <button class="btn" onclick="generateLink()">Generate Smart Link</button>

    <div class="result-box" id="resultBox">
        <div class="result-title">Your Smart Deep Link</div>
        <div class="result-url" id="generatedUrl"></div>
        <div class="action-btns">
            <button class="btn-outline" onclick="copyResult()">Copy Link</button>
            <a href="#" target="_blank" id="testBtn" class="btn-open">Test Link</a>
        </div>
    </div>
</div>

<script>
function generateLink() {
    const input = document.getElementById('targetUrl').value.trim();
    if(!input) { alert('Please enter a valid URL'); return; }

    const currentDomain = window.location.href.split('?')[0];
    const encodedUrl = encodeURIComponent(input);
    
    // Redirect URL format generator
    const finalDeepLink = `${currentDomain}?redirect=${encodedUrl}`;

    document.getElementById('generatedUrl').innerText = finalDeepLink;
    document.getElementById('testBtn').href = finalDeepLink;
    document.getElementById('resultBox').style.display = 'block';
}

function copyResult() {
    const text = document.getElementById('generatedUrl').innerText;
    navigator.clipboard.writeText(text);
    alert('Deep Link Copied successfully!');
}

// Auto Redirection Engine
(function handleAutoRedirect() {
    const urlParams = new URLSearchParams(window.location.search);
    const redirectTarget = urlParams.get('redirect');

    if (redirectTarget) {
        document.body.innerHTML = `
            <div style="text-align:center; color:white;">
                <h2>Opening App...</h2>
                <p style="margin-top:10px; color:#8b949e;">Please wait while we redirect you.</p>
            </div>
        `;
        
        let appScheme = redirectTarget;

        if (redirectTarget.includes('youtube.com') || redirectTarget.includes('youtu.be')) {
            const videoId = redirectTarget.split('v=')[1] || redirectTarget.split('/').pop();
            const cleanId = videoId.split('&')[0];
            appScheme = `intent://www.youtube.com/watch?v=${cleanId}#Intent;package=com.google.android.youtube;scheme=https;end`;
        } else if (redirectTarget.includes('instagram.com')) {
            appScheme = `instagram://user?username=${redirectTarget.split('instagram.com/')[1].split('/')[0]}`;
        } else if (redirectTarget.includes('t.me')) {
            appScheme = `tg://resolve?domain=${redirectTarget.split('t.me/')[1]}`;
        }

        window.location.href = appScheme;

        // Fallback to normal URL after 2.5 seconds if app doesn't open
        setTimeout(() => {
            window.location.href = redirectTarget;
        }, 2500);
    }
})();
</script>

</body>
</html>
