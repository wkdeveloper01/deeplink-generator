<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kodular Extension Creator</title>
    <style>
        :root {
            --bg: #1e1e1e;
            --sidebar: #252526;
            --accent: #7052ff;
            --accent-hover: #5a3ce1;
            --border: #3c3c3c;
            --text: #cccccc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
        
        header { background: #333333; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        header h1 { font-size: 18px; color: #fff; display: flex; align-items: center; gap: 8px; }
        header h1 span { color: var(--accent); }

        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { width: 320px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; }
        .editor-section { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; text-transform: uppercase; margin-bottom: 6px; color: #888; font-weight: 600; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; background: #3c3c3c; border: 1px solid #555; border-radius: 4px; color: #fff; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: var(--accent); }

        .btn { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; width: 100%; margin-top: 10px; }
        .btn:hover { background: var(--accent-hover); }
        .btn-secondary { background: #3a3d41; margin-top: 5px; }

        .code-header { background: #2d2d2d; padding: 10px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        pre { flex: 1; padding: 20px; font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; color: #9cdcfe; overflow: auto; background: #1e1e1e; }

        .block-card { background: #2d2d2d; border: 1px solid var(--border); padding: 12px; border-radius: 6px; margin-bottom: 10px; }
        .block-card h4 { font-size: 13px; color: #4ec9b0; margin-bottom: 8px; }
    </style>
</head>
<body>

<header>
    <h1><span>Kodular</span> Extension Builder</h1>
    <button class="btn" style="width: auto; margin:0;" onclick="copyCode()">Copy Java Code</button>
</header>

<div class="main-container">
    <!-- Extension Configuration Sidebar -->
    <div class="sidebar">
        <h3 style="margin-bottom: 15px; color: #fff; font-size: 16px;">Metadata Config</h3>
        
        <div class="form-group">
            <label>Package Name</label>
            <input type="text" id="pkgName" value="com.akshat.myextension" oninput="generateJava()">
        </div>

        <div class="form-group">
            <label>Extension Class Name</label>
            <input type="text" id="className" value="MyExtension" oninput="generateJava()">
        </div>

        <div class="form-group">
            <label>Icon Asset Path (Optional)</label>
            <input type="text" id="iconPath" value="icon.png" oninput="generateJava()">
        </div>

        <hr style="border-color: var(--border); margin: 20px 0;">

        <h3 style="margin-bottom: 15px; color: #fff; font-size: 16px;">Blocks Manager</h3>
        <div id="blocksContainer"></div>

        <button class="btn btn-secondary" onclick="addFunctionBlock()">+ Add Function Block</button>
        <button class="btn btn-secondary" onclick="addEventBlock()">+ Add Event Block</button>
    </div>

    <!-- Live Java Code Editor Output -->
    <div class="editor-section">
        <div class="code-header">
            <span style="font-size: 13px; font-weight: 600;">Generated Source Code (.java)</span>
        </div>
        <pre id="javaOutput"></pre>
    </div>
</div>

<script>
let blocks = [
    { type: 'function', name: 'MultiplyNumbers', returnType: 'int', paramName: 'number1' },
    { type: 'event', name: 'OnSuccess', paramName: 'response' }
];

function addFunctionBlock() {
    blocks.push({ type: 'function', name: 'NewFunction' + (blocks.length + 1), returnType: 'String', paramName: 'text' });
    renderBlockInputs();
    generateJava();
}

function addEventBlock() {
    blocks.push({ type: 'event', name: 'NewEvent' + (blocks.length + 1), paramName: 'status' });
    renderBlockInputs();
    generateJava();
}

function removeBlock(index) {
    blocks.splice(index, 1);
    renderBlockInputs();
    generateJava();
}

function renderBlockInputs() {
    const container = document.getElementById('blocksContainer');
    container.innerHTML = '';

    blocks.forEach((block, index) => {
        const div = document.createElement('div');
        div.className = 'block-card';
        div.innerHTML = `
            <h4>${block.type === 'function' ? '⚡ Function Block' : '🔔 Event Block'}</h4>
            <div class="form-group">
                <input type="text" value="${block.name}" placeholder="Block Name" onchange="updateBlock(${index}, 'name', this.value)">
            </div>
            <div class="form-group">
                <input type="text" value="${block.paramName}" placeholder="Parameter Name" onchange="updateBlock(${index}, 'paramName', this.value)">
            </div>
            <button onclick="removeBlock(${index})" style="background: #e51c23; color:#fff; border:none; padding:4px 8px; border-radius:3px; cursor:pointer; font-size:11px;">Delete Block</button>
        `;
        container.appendChild(div);
    });
}

function updateBlock(index, key, value) {
    blocks[index][key] = value;
    generateJava();
}

function generateJava() {
    const pkg = document.getElementById('pkgName').value.trim();
    const cls = document.getElementById('className').value.trim();
    const icon = document.getElementById('iconPath').value.trim();

    let blocksCode = '';

    blocks.forEach(b => {
        if (b.type === 'function') {
            blocksCode += `
    @SimpleFunction(description = "Executes ${b.name}")
    public ${b.returnType || 'void'} ${b.name}(${b.returnType === 'int' ? 'int' : 'String'} ${b.paramName}) {
        // Custom Logic Here
        return ${b.returnType === 'int' ? '0' : '""'};
    }\n`;
        } else if (b.type === 'event') {
            blocksCode += `
    @SimpleEvent(description = "Triggers ${b.name}")
    public void ${b.name}(String ${b.paramName}) {
        EventDispatcher.dispatchEvent(this, "${b.name}", ${b.paramName});
    }\n`;
        }
    });

    const javaTemplate = `package ${pkg};

import com.google.appinventor.components.annotations.*;
import com.google.appinventor.components.common.ComponentCategory;
import com.google.appinventor.components.runtime.*;
import com.google.appinventor.components.runtime.util.*;

@DesignerComponent(
    version = 1,
    description = "Generated via Kodular Builder",
    category = ComponentCategory.EXTENSION,
    nonVisible = true,
    iconName = "${icon}"
)
@SimpleObject(external = true)
public class ${cls} extends AndroidNonvisibleComponent {

    public ${cls}(ComponentContainer container) {
        super(container.$form());
    }

${blocksCode}
}`;

    document.getElementById('javaOutput').innerText = javaTemplate;
}

function copyCode() {
    const code = document.getElementById('javaOutput').innerText;
    navigator.clipboard.writeText(code);
    alert('Java extension code copied!');
}

// Initial setup
renderBlockInputs();
generateJava();
</script>

</body>
</html>
