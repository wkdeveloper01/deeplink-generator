<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[BETA] Deeplink Extension Generator</title>
    <!-- JSZip Library for generating valid AIX zip archives -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f9; color: #333; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px 15px; }
        
        .header-card { background: #ffffff; width: 100%; max-width: 450px; border-radius: 12px; padding: 25px 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .header-title { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 20px; font-weight: 700; color: #3498db; margin-bottom: 15px; }
        .puzzle-icon { font-size: 24px; color: #3498db; }
        .nav-links { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; font-size: 14px; color: #555; }
        .nav-links a { text-decoration: none; color: #666; font-weight: 500; }
        .yt-btn { display: inline-block; background-color: #ff3b30; color: #fff; border: none; padding: 8px 18px; border-radius: 6px; font-weight: bold; font-size: 14px; text-decoration: none; }

        .form-card { background: #ffffff; width: 100%; max-width: 450px; border-radius: 12px; padding: 25px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 16px; font-weight: 700; color: #111; margin-bottom: 8px; }
        .input-group input, .input-group select { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; color: #333; outline: none; background: #fff; }
        .input-group input::placeholder { color: #9ca3af; }
        .input-group input:focus, .input-group select:focus { border-color: #3498db; }

        .download-btn { width: 100%; background: transparent; color: #3498db; border: 2px solid #3498db; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .download-btn:hover { background: #3498db; color: #ffffff; }

        footer { font-size: 13px; color: #555; text-align: center; max-width: 400px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="header-card">
        <div class="header-title">
            <span class="puzzle-icon">🧩</span> [BETA] Deeplink Extension Generator
        </div>
        <div class="nav-links">
            <a href="#">Website</a>
            <a href="#">Documentation</a>
            <a href="#">Video Tutorial</a>
        </div>
        <a href="https://youtube.com" target="_blank" class="yt-btn">Youtube &rarr;</a>
    </div>

    <div class="form-card">
        <div class="input-group">
            <label>Enter Domain:</label>
            <input type="text" id="domain" placeholder="Don't add http:// or https:// before domain">
        </div>

        <div class="input-group">
            <label>Enter Path Prefix:</label>
            <input type="text" id="pathPrefix" value="/">
        </div>

        <div class="input-group">
            <label>Select Scheme:</label>
            <select id="scheme">
                <option value="http_https">http and https</option>
                <option value="https">https only</option>
                <option value="http">http only</option>
            </select>
        </div>

        <button class="download-btn" onclick="generateAndDownloadAIX()">Download AIX</button>
    </div>

    <footer>
        Developed By Akshat Developer. Special Thanks To Anshuman Mishra aka
    </footer>

    <script>
    async function generateAndDownloadAIX() {
        const domain = document.getElementById('domain').value.trim();
        const path = document.getElementById('pathPrefix').value.trim() || '/';
        const schemeOption = document.getElementById('scheme').value;

        if (!domain) {
            alert("Please enter a valid domain name!");
            return;
        }

        const cleanDomain = domain.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
        const className = "Deeplink" + cleanDomain.replace(/[^a-zA-Z0-9]/g, '');
        const packageName = "com.deeplink." + cleanDomain.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();

        // 1. Android Manifest Element Structure
        let schemeXml = '';
        if (schemeOption === 'http_https') {
            schemeXml = `<data android:scheme="http" android:host="${cleanDomain}" android:pathPrefix="${path}" />
            <data android:scheme="https" android:host="${cleanDomain}" android:pathPrefix="${path}" />`;
        } else {
            schemeXml = `<data android:scheme="${schemeOption}" android:host="${cleanDomain}" android:pathPrefix="${path}" />`;
        }

        const manifestXml = `<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="${packageName}">
    <application>
        <activity android:name="com.google.appinventor.components.runtime.Form">
            <intent-filter android:autoVerify="true">
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                ${schemeXml}
            </intent-filter>
        </activity>
    </application>
</manifest>`;

        // 2. Kodular Required components.json Descriptor
        const componentsJson = JSON.stringify([{
            "name": className,
            "version": "1",
            "categoryString": "EXTENSION",
            "helpUrl": "",
            "showOnPalette": "true",
            "nonVisible": "true",
            "iconName": "icon.png",
            "properties": [],
            "blockProperties": [],
            "events": [],
            "methods": []
        }]);

        // 3. Build Valid AIX (ZIP Archive) Structure
        const zip = new JSZip();
        
        // Add required components descriptor file
        zip.file("components.json", componentsJson);
        
        // Add extension inner package path
        const packageFolder = zip.folder("files");
        packageFolder.file("AndroidManifest.xml", manifestXml);
        packageFolder.file("component.build_info.json", JSON.stringify({
            "assets": [],
            "libraries": [],
            "native": [],
            "permissions": []
        }));

        // Generate binary ZIP Blob
        const content = await zip.generateAsync({ type: "blob" });

        // Trigger valid .aix download
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = `${className}.aix`;
        link.click();
    }
    </script>

</body>
</html>
