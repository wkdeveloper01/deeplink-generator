<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[BETA] Deeplink Extension Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f9; color: #333; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px 15px; }
        
        /* Header Box */
        .header-card { background: #ffffff; width: 100%; max-width: 450px; border-radius: 12px; padding: 25px 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .header-title { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 20px; font-weight: 700; color: #3498db; margin-bottom: 15px; }
        .puzzle-icon { font-size: 24px; color: #3498db; }
        .nav-links { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; font-size: 14px; color: #555; }
        .nav-links a { text-decoration: none; color: #666; font-weight: 500; }
        .yt-btn { display: inline-block; background-color: #ff3b30; color: #fff; border: none; padding: 8px 18px; border-radius: 6px; font-weight: bold; font-size: 14px; text-decoration: none; }

        /* Form Main Card */
        .form-card { background: #ffffff; width: 100%; max-width: 450px; border-radius: 12px; padding: 25px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 16px; font-weight: 700; color: #111; margin-bottom: 8px; }
        .input-group input, .input-group select { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; color: #333; outline: none; background: #fff; }
        .input-group input::placeholder { color: #9ca3af; }
        .input-group input:focus, .input-group select:focus { border-color: #3498db; }

        .download-btn { width: 100%; background: transparent; color: #3498db; border: 2px solid #3498db; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .download-btn:hover { background: #3498db; color: #ffffff; }

        /* Footer */
        footer { font-size: 13px; color: #555; text-align: center; max-width: 400px; line-height: 1.4; }
    </style>
</head>
<body>

    <!-- Header Box -->
    <div class="header-card">
        <div class="header-title">
            <span class="puzzle-icon">🧩</span> [BETA] Deeplink Extension Generator
        </div>
        <div class="nav-links">
            <a href="#">Website</a>
            <a href="#">Documentation</a>
            <a href="#">Video Tutorial</a>
        </div>
        <a href="https://youtube.com" target="_blank" class="yt-btn">Youtube &rarr;</a>
    </div>

    <!-- Form Box -->
    <div class="form-card">
        <div class="input-group">
            <label>Enter Domain:</label>
            <input type="text" id="domain" placeholder="Don't add http:// or https:// before domain">
        </div>

        <div class="input-group">
            <label>Enter Path Prefix:</label>
            <input type="text" id="pathPrefix" value="/">
        </div>

        <div class="input-group">
            <label>Select Scheme:</label>
            <select id="scheme">
                <option value="http_https">http and https</option>
                <option value="https">https only</option>
                <option value="http">http only</option>
            </select>
        </div>

        <button class="download-btn" onclick="generateAndDownload()">Download AIX</button>
    </div>

    <!-- Footer -->
    <footer>
        Developed By Akshat Developer. Special Thanks To Anshuman Mishra aka
    </footer>

    <script>
    function generateAndDownload() {
        const domain = document.getElementById('domain').value.trim();
        const path = document.getElementById('pathPrefix').value.trim();
        const scheme = document.getElementById('scheme').value;

        if (!domain) {
            alert("Please enter a valid domain name!");
            return;
        }

        // Demo XML AndroidManifest manifest snippet generation
        const manifestContent = `<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <application>
        <activity android:name=".MainActivity">
            <intent-filter android:autoVerify="true">
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="${scheme === 'http_https' ? 'https' : scheme}" android:host="${domain}" android:pathPrefix="${path}" />
            </intent-filter>
        </activity>
    </application>
</manifest>`;

        // Create virtual download file for developer
        const blob = new Blob([manifestContent], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${domain.replace(/[^a-zA-Z0-9]/g, '_')}_deeplink.aix`;
        link.click();
    }
    </script>

</body>
</html>
