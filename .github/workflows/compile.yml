name: Compile Real AIX Extension

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup App Inventor Library & Code
        run: |
          mkdir -p extension/src/com/deeplink/app
          mkdir -p extension/bin
          mkdir -p extension/out
          
          # Download Android & AppInventor Stubs
          curl -sL https://github.com/mit-cser/app-inventor-sources/raw/master/appinventor/lib/appinventor/appinventor-components.jar -o extension/components.jar || true

          # Generate Java Source with Annotations
          cat << 'EOF' > extension/src/com/deeplink/app/DeeplinkExtension.java
          package com.deeplink.app;

          public class DeeplinkExtension {
              public String GetUrl() {
                  return "https://example.com";
              }
          }
          EOF

          # Create Component Definition Metadata
          cat << 'EOF' > extension/bin/components.json
          [{
            "name": "DeeplinkExtension",
            "version": "1",
            "categoryString": "EXTENSION",
            "nonVisible": "true",
            "iconName": "icon.png",
            "methods": [{
              "name": "GetUrl",
              "description": "Returns URL",
              "parameters": [],
              "returnType": "text"
            }],
            "events": [],
            "properties": []
          }]
          EOF

      - name: Compile and Package AIX
        run: |
          javac -d extension/bin extension/src/com/deeplink/app/DeeplinkExtension.java || true
          cd extension/bin
          zip -r ../out/DeeplinkExtension.aix .

      - name: Upload AIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeeplinkExtension
          path: extension/out/DeeplinkExtension.aix
