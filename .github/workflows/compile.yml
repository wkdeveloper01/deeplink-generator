name: Compile Real AIX Extension

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Fast CLI
        run: npm install -g gnu-fast

      - name: Create and Build
        run: |
          fast create deeplink --package com.deeplink.app
          cd deeplink
          fast build

      - name: Upload AIX Artifact
        uses: actions/upload-artifact@v3
        with:
          name: DeeplinkExtension
          path: deeplink/out/*.aix
