name: Compile Real AIX Extension

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Rush CLI
        run: npm install -g rush-cli

      - name: Create Rush Project
        run: rush create deeplink --org com.deeplink --author Developer

      - name: Build Extension
        run: |
          cd deeplink
          rush build

      - name: Upload AIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeeplinkExtension
          path: deeplink/out/*.aix
