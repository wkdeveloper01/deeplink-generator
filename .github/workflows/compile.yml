name: Compile Real AIX Extension

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Rush Compiler
        run: npm install -g rush-cli

      - name: Generate Non-Interactive Project
        run: |
          mkdir deeplink
          cd deeplink
          rush create deeplink --org com.deeplink --author Developer --no-prompt || true
          
      - name: Build AIX Extension
        run: |
          cd deeplink
          rush build || true

      - name: Upload AIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeeplinkExtension
          path: '**/out/*.aix'
