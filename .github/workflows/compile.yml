name: Compile Real AIX Extension

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install Fast CLI
        run: npm install -g gnu-fast

      - name: Build Valid Extension Structure
        run: |
          mkdir build_env
          cd build_env
          fast create DeeplinkExtension --package com.deeplink.app --author Developer < /dev/null || true
          cd DeeplinkExtension
          fast build < /dev/null || true

      - name: Upload AIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeeplinkExtension
          path: '**/out/*.aix'
